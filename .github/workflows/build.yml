name: Build

# Full builds run on pushes to main, releases (v* tags) and manual runs;
# pull requests run just the test job. Other branch pushes run nothing.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Actions > Build > Run workflow. With a version this publishes a release
  # from main and creates its tag; without one it is just a test build.
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.2.0 or 0.3.0-beta.1 (empty = test build only)"
        required: false
        default: ""

permissions:
  contents: write

env:
  GO_VERSION: "1.24"
  NODE_VERSION: "22"
  WAILS_VERSION: "v2.10.1"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install socat (virtual serial ports for RTU tests)
        run: sudo apt-get update && sudo apt-get install -y socat
      - name: Go tests
        run: go test -race ./internal/... ./cmd/...
      - name: Frontend typecheck
        working-directory: frontend
        run: npm ci && npx tsc --noEmit

  build:
    if: github.event_name != 'pull_request'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            flags: -nsis
          - os: macos-latest
            platform: darwin/universal
            flags: ""
          - os: ubuntu-24.04
            platform: linux/amd64
            flags: -tags webkit2_41
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: NSIS (Windows installer tool)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Current windows-latest images no longer ship NSIS.
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Build
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="${INPUT_VERSION#v}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$VERSION' is not a version like 1.2.3 or 1.2.3-beta.1"
            exit 1
          fi
          # The public key is pinned in internal/version; make sure the
          # signing secret (if available) is the matching one.
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            go run ./cmd/updatekey check
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Installer/exe metadata wants a plain x.y.z version.
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('wails.json'));j.info.productVersion=process.argv[1];fs.writeFileSync('wails.json',JSON.stringify(j,null,2))" "${VERSION%%-*}"
          PKG=modbusstudio/internal/version
          LDFLAGS="-X $PKG.Version=$VERSION -X $PKG.Commit=$GITHUB_SHA -X $PKG.UpdateRepo=$GITHUB_REPOSITORY"
          echo "Building Modbus Studio $VERSION"
          wails build -clean -platform ${{ matrix.platform }} ${{ matrix.flags }} -ldflags "$LDFLAGS"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/bin/ModbusStudio.exe dist/ModbusStudio-windows-amd64.exe
          $installer = Get-ChildItem build/bin -Filter *installer.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not built (is makensis installed?)" }
          Copy-Item $installer.FullName dist/ModbusStudio-windows-amd64-installer.exe
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/bin/ModbusStudio.app dist/ModbusStudio-macos-universal.zip
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -C build/bin -czf dist/ModbusStudio-linux-amd64.tar.gz ModbusStudio
          build/linux/package-deb.sh "$VERSION" build/bin/ModbusStudio libwebkit2gtk-4.1-0 dist/ModbusStudio-ubuntu-24.04-amd64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: ModbusStudio-${{ runner.os }}
          path: dist/*

  build-linux-legacy:
    # Ubuntu 18.04-22.04 ship WebKitGTK 4.0 and older glibc, so this build
    # is compiled inside an Ubuntu 18.04 container: a binary linked there
    # runs on every later release. (Node 22 cannot run on 18.04, so the
    # frontend is built on the host first and embedded by `go build`.)
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then VERSION="${INPUT_VERSION#v}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"
          else VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Build in Ubuntu 18.04
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e VERSION -e GITHUB_SHA -e GITHUB_REPOSITORY -e GO_TARBALL=go1.24.13.linux-amd64.tar.gz \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            ubuntu:18.04 bash -euc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends build-essential pkg-config \
                libgtk-3-dev libwebkit2gtk-4.0-dev curl ca-certificates >/dev/null
              curl -fsSL "https://go.dev/dl/$GO_TARBALL" | tar -C /usr/local -xz
              export PATH=/usr/local/go/bin:$PATH GOFLAGS=-buildvcs=false
              PKG=modbusstudio/internal/version
              go build -tags desktop,production -trimpath \
                -ldflags "-w -s -X $PKG.Version=$VERSION -X $PKG.Commit=$GITHUB_SHA -X $PKG.UpdateRepo=$GITHUB_REPOSITORY" \
                -o build/bin/ModbusStudio-legacy .
              chown -R "$HOST_UID:$HOST_GID" build
            '
      - name: Check glibc requirement (must run on 18.04)
        run: |
          NEED=$(objdump -T build/bin/ModbusStudio-legacy | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "needs $NEED"
          [ "$(printf '%s\n' GLIBC_2.27 "$NEED" | sort -V | tail -1)" = GLIBC_2.27 ]
      - name: Package
        run: |
          mkdir -p dist
          build/linux/package-deb.sh "$VERSION" build/bin/ModbusStudio-legacy libwebkit2gtk-4.0-37 dist/ModbusStudio-ubuntu-18.04-to-22.04-amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: ModbusStudio-Linux-legacy
          path: dist/*

  release:
    # Publishes a GitHub release with signed checksums. The in-app updater
    # only installs packages listed in a checksums.txt whose Ed25519
    # signature matches the public key compiled into the running build.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: [build, build-linux-legacy]
    runs-on: ubuntu-24.04
    steps:
      - name: Release tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$GITHUB_REF" != refs/heads/main ]]; then
              echo "::error::Releases are published from main; run the workflow on main"
              exit 1
            fi
            TAG="v${INPUT_VERSION#v}"
            # Never overwrite an existing release by accident.
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag $TAG already exists; choose a new version"
              exit 1
            fi
          else
            TAG="$GITHUB_REF_NAME"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Publishing $TAG from $GITHUB_SHA"
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and signature
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::UPDATE_SIGNING_KEY secret is not set; see docs/UPDATES.md"
            exit 1
          fi
          (cd dist && sha256sum ModbusStudio-* > checksums.txt && cat checksums.txt)
          go run ./cmd/updatekey check
          go run ./cmd/updatekey sign dist/checksums.txt
          PINNED=$(sed -n 's/^const PinnedUpdatePublicKey = "\(.*\)"$/\1/p' internal/version/version.go)
          go run ./cmd/updatekey verify dist/checksums.txt "$PINNED"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Modbus Studio ${{ env.TAG }}
          files: dist/*
          prerelease: ${{ contains(env.TAG, '-') }}
          generate_release_notes: true
